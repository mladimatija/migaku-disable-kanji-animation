name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and package
        run: npm run package
      - name: Compute SHA-256 of the artifact
        run: |
          sha256sum migaku-disable-kanji-animation.zip > migaku-disable-kanji-animation.zip.sha256
          echo "SHA256: $(cat migaku-disable-kanji-animation.zip.sha256)"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            migaku-disable-kanji-animation.zip
            migaku-disable-kanji-animation.zip.sha256
