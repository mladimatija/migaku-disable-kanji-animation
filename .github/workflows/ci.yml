name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Build + E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:install
      # `pretest` builds dist/. Extensions only load in headed Chromium, so
      # xvfb-run provides a virtual display on Linux.
      - name: Run E2E tests
        run: xvfb-run --auto-servernum npm test
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: dist
          if-no-files-found: error
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
